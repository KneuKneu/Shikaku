<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shikaku - Volledig Werkend</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #1a1a1a; color: #ffffff;
            font-family: sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100vh; user-select: none; -webkit-user-select: none;
        }

        .screen { display: none; width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; text-align: center; }
        .active { display: block; }

        h1 { margin-bottom: 10px; font-size: 1.8rem; color: #0096ff; }
        h2 { color: #aaa; font-size: 1.2rem; margin-top: 20px; text-align: left; padding-left: 5px; }
        
        .pack-container {
            background: #2a2a2a; border-radius: 8px; padding: 15px; margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: relative;
        }
        .pack-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .pack-header h2 { margin: 0; }
        .delete-pack-btn { background: none; border: none; color: #ff4444; font-size: 1.2rem; cursor: pointer; padding: 5px; }
        
        .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .level-btn {
            background-color: #3a3a3a; color: white; border: 2px solid #555; border-radius: 8px;
            padding: 15px 0; font-size: 1.1rem; font-weight: bold; cursor: pointer;
        }
        .level-btn.completed { border-color: #4caf50; background-color: rgba(76, 175, 80, 0.2); }
        .no-levels-text { color: #777; font-style: italic; grid-column: span 4; padding: 10px 0; }

        #info { margin-bottom: 15px; color: #ffeb3b; font-size: 1.1rem; height: 24px; font-weight: bold; }
        #canvasContainer { background-color: #2a2a2a; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-radius: 8px; padding: 10px; display: inline-block; }
        canvas { display: block; touch-action: none; }

        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        button.game-btn { padding: 12px 20px; color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; font-weight: bold; }
        .btn-blue { background-color: #0096ff; }
        .btn-back { background-color: #555; }
        .btn-reset { background-color: #e53935; }
        .btn-green { background-color: #4caf50; }
        .btn-orange { background-color: #ffa726; }
        .btn-purple { background-color: #ab47bc; }

        .editor-tools { margin-top: 15px; background: #2a2a2a; padding: 15px; border-radius: 8px; text-align: left; }
        .tool-row { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .tool-select { padding: 8px; background: #3a3a3a; color: white; border: 1px solid #555; border-radius: 4px; font-size: 1rem; }
        #editorCanvas { cursor: crosshair; }
        .dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }
        .dialog-overlay.open { display: flex; }
        .dialog-card {
            width: min(100%, 360px);
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            text-align: left;
        }
        .dialog-card h2 { margin-top: 0; }
        .dialog-card p { margin: 0 0 12px; color: #ccc; }
        .dialog-input-wrap { margin-bottom: 12px; }
        .dialog-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #1f1f1f;
            color: white;
            font-size: 1rem;
        }
        .dialog-hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="menuScreen" class="screen active">
        <h1>Shikaku Puzzels</h1>
        <div class="btn-group" style="margin-bottom: 20px;">
            <button type="button" class="game-btn btn-blue" style="flex: 1;" onclick="startEditor()">🛠️ Level Editor</button>
            <button type="button" class="game-btn btn-purple" style="flex: 1;" onclick="createNewPack()">📁 Nieuw Pack</button>
        </div>
        <div id="packsList"></div>
    </div>

    <div id="gameScreen" class="screen">
        <h1 id="levelTitle">Level X</h1>
        <div id="info">Sleep om te plaatsen, Tik om te wissen</div>
        
        <div id="canvasContainer">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <div class="btn-group">
            <button type="button" id="backBtn" class="game-btn btn-back" onclick="showMenu()">Menu</button>
            <button type="button" class="game-btn btn-reset" onclick="resetLevel()">Reset</button>
        </div>
    </div>

    <div id="editorScreen" class="screen">
        <h1>Level Editor</h1>
        
        <div class="editor-tools">
            <div class="tool-row">
                <span>Grootte van het grid:</span>
                <select id="gridSizeSelect" class="tool-select" onchange="changeEditorGridSize(this.value)">
                    <option value="4" selected>4 x 4</option>
                    <option value="5">5 x 5</option>
                    <option value="8">8 x 8</option>
                </select>
            </div>
        </div>

        <div id="canvasContainer" style="margin: 15px 0;">
            <canvas id="editorCanvas" width="400" height="400"></canvas>
        </div>

        <div class="editor-tools">
            <div class="tool-row">
                <span>Selecteer Tool:</span>
                <select id="toolSelect" class="tool-select">
                    <option value="0">Leeg vakje (0)</option>
                    <option value="X">Buiten veld (Muur X)</option>
                    <option value="O">Opvulstip (•)</option>
                    <option value="NUMBER">Gewoon Getal...</option>
                    <option value="FORMULA">Vorm-Formule (bijv. 3x2)...</option>
                </select>
            </div>
            <div class="tool-row" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #444;">
                <span>Opslaan in Pack:</span>
                <select id="targetPackSelect" class="tool-select">
                    </select>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" class="game-btn btn-back" onclick="showMenu()">Menu</button>
            <button type="button" class="game-btn btn-green" onclick="testCustomLevel()">▶️ Testen</button>
            <button type="button" class="game-btn btn-orange" onclick="saveCustomLevel()">💾 Level Opslaan</button>
        </div>
    </div>

    <div id="packDialog" class="dialog-overlay" aria-hidden="true">
        <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
            <h2 id="dialogTitle">Nieuw Pack</h2>
            <p id="dialogMessage">Geef je level pack een naam.</p>
            <div id="dialogInputWrap" class="dialog-input-wrap">
                <input id="dialogInput" class="dialog-input" type="text" maxlength="40" placeholder="Bijv. Mijn Pack">
            </div>
            <div class="btn-group" style="margin-top: 16px;">
                <button id="dialogCancelBtn" type="button" class="game-btn btn-back">Annuleren</button>
                <button id="dialogConfirmBtn" type="button" class="game-btn btn-purple">Maken</button>
            </div>
        </div>
    </div>

<script>
// Standaard ingebouwde levels
const defaultPacks = [
    {
        id: "built_in_1",
        name: "Pack 1: Introductie",
        levels: [
            {
                id: "1-1", width: 4, height: 4,
                grid: [
                    ["1", "3", "0", "0"],
                    ["2", "0", "2", "0"],
                    ["4", "0", "4", "0"],
                    ["0", "0", "0", "0"]
                ]
            }
        ]
    }
];

// Game & Editor Engine State
let currentScreen = "menu"; // "menu", "game", "editor"
let currentLevel = null;
let isTestingCustom = false;
let dragStart = null;
let dragEnd = null;
let hasDragged = false;
let userShapes = [];
let editorHoverCell = null;
const colors = ["#26a69a", "#ab47bc", "#ec407a", "#ffa726", "#26c6da", "#8d6e63"];

let editorLevel = { width: 4, height: 4, grid: Array(4).fill(null).map(() => Array(4).fill("0")) };
const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
const editorCanvas = document.getElementById('editorCanvas'); const eCtx = editorCanvas.getContext('2d');
const infoDiv = document.getElementById('info'); let cellSize = 50;
const packDialog = document.getElementById('packDialog');
const packNameInput = document.getElementById('packNameInput');

function getCustomPacks() {
    const saved = localStorage.getItem('shikaku_custom_packs_v2');
    return saved ? JSON.parse(saved) : [];
}

function saveCustomPacks(packs) {
    localStorage.setItem('shikaku_custom_packs_v2', JSON.stringify(packs));
}

function createNewPack() {
    openPackDialog();
}

function openPackDialog() {
    packNameInput.value = "";
    packDialog.classList.add('open');
    packDialog.setAttribute('aria-hidden', 'false');
    setTimeout(() => packNameInput.focus(), 0);
}

function closePackDialog() {
    packDialog.classList.remove('open');
    packDialog.setAttribute('aria-hidden', 'true');
}

function confirmNewPack() {
    const name = packNameInput.value.trim();
    if (!name) {
        packNameInput.focus();
        return;
    }
    const packs = getCustomPacks();
    packs.push({ id: `pack_${Date.now()}`, name, levels: [] });
    saveCustomPacks(packs);
    closePackDialog();
    initMenu();
}

function deletePack(packId) {
    if (!confirm("Weet je zeker dat je dit complete Pack inclusief alle levels wilt verwijderen?")) return;
    let packs = getCustomPacks();
    packs = packs.filter(p => p.id !== packId);
    saveCustomPacks(packs);
    initMenu();
}

function initMenu() {
    const container = document.getElementById('packsList');
    container.innerHTML = "";
    renderPacksArray(defaultPacks, container, false);
    const customPacks = getCustomPacks();
    renderPacksArray(customPacks, container, true);
}

function renderPacksArray(packs, container, isDeletable) {
    packs.forEach(pack => {
        const packDiv = document.createElement('div');
        packDiv.className = 'pack-container';
        
        let headerHTML = `<div class="pack-header"><h2>${pack.name}</h2>`;
        if (isDeletable) headerHTML += `<button class="delete-pack-btn" onclick="deletePack('${pack.id}')">🗑️</button>`;
        headerHTML += `</div>`;
        packDiv.innerHTML = headerHTML;

        const levelGrid = document.createElement('div');
        levelGrid.className = 'level-grid';

        if (pack.levels.length === 0) {
            levelGrid.innerHTML = `<div class="no-levels-text">Nog geen levels. Maak er een via de editor!</div>`;
        } else {
            pack.levels.forEach((lvl, index) => {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                if(localStorage.getItem(`shikaku_completed_${lvl.id}`)) btn.className += ' completed';
                btn.innerText = index + 1;
                btn.onclick = () => { isTestingCustom = false; startLevel(lvl); };
                levelGrid.appendChild(btn);
            });
        }
        packDiv.appendChild(levelGrid);
        container.appendChild(packDiv);
    });
}

function showMenu() {
    currentScreen = "menu";
    document.querySelectorAll('.screen').forEach(s => s.className = 'screen');
    document.getElementById('menuScreen').className = 'screen active';
    closePackDialog();
    initMenu();
}

function startLevel(level) {
    currentScreen = "game";
    currentLevel = level;
    document.getElementById('levelTitle').innerText = isTestingCustom ? "Test Modus" : `Puzzel`;
    document.getElementById('backBtn').onclick = isTestingCustom ? startEditor : showMenu;
    document.getElementById('backBtn').innerText = isTestingCustom ? "Terug naar Editor" : "Menu";
    document.getElementById('menuScreen').className = 'screen';
    document.getElementById('editorScreen').className = 'screen';
    document.getElementById('gameScreen').className = 'screen active';
    
    cellSize = Math.floor(400 / level.width);
    canvas.width = level.width * cellSize; canvas.height = level.height * cellSize;

    const saved = localStorage.getItem(`shikaku_progress_${currentLevel.id}`);
    userShapes = (saved && !isTestingCustom) ? JSON.parse(saved) : [];
    infoDiv.style.color = "#ffeb3b"; infoDiv.innerText = "Sleep om te plaatsen, Tik om te wissen";
    drawGame();
}

// GAMEPLAY DRAW ENGINE
function drawGame() {
    if (!currentLevel || currentScreen !== "game") return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let r = 0; r < currentLevel.height; r++) {
        for (let c = 0; c < currentLevel.width; c++) {
            const cellType = currentLevel.grid[r][c];
            const x = c * cellSize; const y = r * cellSize;
            if (cellType === "X") {
                ctx.fillStyle = "#222222"; ctx.fillRect(x, y, cellSize, cellSize);
            } else {
                ctx.fillStyle = "#3a3a3a"; ctx.fillRect(x, y, cellSize, cellSize);
                ctx.strokeStyle = "#555555"; ctx.strokeRect(x, y, cellSize, cellSize);
            }
        }
    }

    userShapes.forEach(shape => {
        const x = shape.startCol * cellSize; const y = shape.startRow * cellSize;
        const wWidth = ((shape.endCol - shape.startCol) + 1);
        const hHeight = ((shape.endRow - shape.startRow) + 1);
        ctx.fillStyle = shape.color; ctx.fillRect(x, y, wWidth * cellSize, hHeight * cellSize);
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(x, y, wWidth * cellSize, hHeight * cellSize);

        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.font = `bold ${cellSize * 0.25}px sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(`${wWidth}x${hHeight}`, x + (wWidth * cellSize) / 2, y + (hHeight * cellSize) / 2);
    });

    for (let r = 0; r < currentLevel.height; r++) {
        for (let c = 0; c < currentLevel.width; c++) {
            const cellType = currentLevel.grid[r][c];
            const isCovered = userShapes.some(s => r >= s.startRow && r <= s.endRow && c >= s.startCol && c <= s.endCol);
            if (cellType !== "0" && cellType !== "X" && !isCovered) {
                const x = c * cellSize; const y = r * cellSize;
                ctx.fillStyle = "#ffffff";
                const isFormula = cellType.includes('x');
                ctx.font = `bold ${cellSize * (isFormula ? 0.25 : 0.4)}px sans-serif`;
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(cellType === "O" ? "•" : cellType, x + cellSize / 2, y + cellSize / 2);
            }
        }
    }

    if (dragStart && dragEnd) {
        const startRow = Math.min(dragStart.row, dragEnd.row); const endRow = Math.max(dragStart.row, dragEnd.row);
        const startCol = Math.min(dragStart.col, dragEnd.col); const endCol = Math.max(dragStart.col, dragEnd.col);
        const wCells = (endCol - startCol) + 1; const hCells = (endRow - startRow) + 1;
        infoDiv.style.color = "#ffeb3b"; infoDiv.innerText = `Selectie: ${wCells} x ${hCells} (${wCells * hCells} vakjes)`;
        ctx.fillStyle = "rgba(0, 150, 255, 0.4)";
        ctx.fillRect(startCol * cellSize, startRow * cellSize, wCells * cellSize, hCells * cellSize);
        ctx.strokeStyle = "#0096ff"; ctx.lineWidth = 3;
        ctx.strokeRect(startCol * cellSize, startRow * cellSize, wCells * cellSize, hCells * cellSize);
    }
}

function tryDeleteShape(row, col) {
    const originalLength = userShapes.length;
    userShapes = userShapes.filter(shape => !(row >= shape.startRow && row <= shape.endRow && col >= shape.startCol && col <= shape.endCol));
    if (userShapes.length !== originalLength) {
        if(!isTestingCustom) localStorage.setItem(`shikaku_progress_${currentLevel.id}`, JSON.stringify(userShapes));
        infoDiv.style.color = "#ff9800"; infoDiv.innerText = "Blok verwijderd.";
        drawGame(); return true;
    }
    return false;
}

function validateAndPlaceShape(startRow, endRow, startCol, endCol) {
    let hintsFound = []; let containsX = false;
    const currentWidth = (endCol - startCol) + 1; const currentHeight = (endRow - startRow) + 1;
    const totalCells = currentWidth * currentHeight;

    for (let r = startRow; r <= endRow; r++) {
        for (let c = startCol; c <= endCol; c++) {
            const cell = currentLevel.grid[r][c];
            if (cell === "X") containsX = true;
            if (cell !== "0" && cell !== "X") hintsFound.push({ row: r, col: c, type: cell });
        }
    }

    if (containsX) { showError("Buiten het speelveld!"); return; }
    if (hintsFound.length !== 1) { showError("Moet exact 1 hint bevatten!"); return; }

    const hint = hintsFound[0];
    if (hint.type !== "O") {
        if (hint.type.includes('x')) {
            const parts = hint.type.split('x');
            if (currentWidth !== parseInt(parts[0]) || currentHeight !== parseInt(parts[1])) {
                showError(`Vereist exact ${parts[0]}x${parts[1]}!`); return;
            }
        } else {
            if (parseInt(hint.type) !== totalCells) { showError(`Vereist exact ${hint.type} vakjes!`); return; }
        }
    }

    let hasOverlap = false;
    userShapes.forEach(shape => {
        const overlap = !(endCol < shape.startCol || startCol > shape.endCol || endRow < shape.startRow || startRow > shape.endRow);
        if (overlap) hasOverlap = true;
    });
    if (hasOverlap) { showError("Overlapt met een bestaand blok!"); return; }

    userShapes.push({ startRow, endRow, startCol, endCol, color: colors[userShapes.length % colors.length] });
    if(!isTestingCustom) localStorage.setItem(`shikaku_progress_${currentLevel.id}`, JSON.stringify(userShapes));
    infoDiv.style.color = "#4caf50"; infoDiv.innerText = "Blok geplaatst!";
    checkWinCondition();
}

function showError(msg) { infoDiv.style.color = "#f44336"; infoDiv.innerText = msg; }

function checkWinCondition() {
    let playableCells = 0;
    for(let r=0; r<currentLevel.height; r++) {
        for(let c=0; c<currentLevel.width; c++) { if (currentLevel.grid[r][c] !== "X") playableCells++; }
    }
    let filledCells = 0;
    userShapes.forEach(s => { filledCells += ((s.endRow - s.startRow) + 1) * ((s.endCol - s.startCol) + 1); });
    if (filledCells === playableCells) {
        if(!isTestingCustom) localStorage.setItem(`shikaku_completed_${currentLevel.id}`, "true");
        setTimeout(() => { infoDiv.style.color = "#4caf50"; infoDiv.innerText = "🎉 Level Voltooid! 🎉"; }, 300);
    }
}

function resetLevel() { userShapes = []; if(!isTestingCustom) localStorage.removeItem(`shikaku_progress_${currentLevel.id}`); drawGame(); }

// EDITOR LOGICA
function startEditor() {
    currentScreen = "editor";
    document.querySelectorAll('.screen').forEach(s => s.className = 'screen');
    document.getElementById('editorScreen').className = 'screen active';
    
    const select = document.getElementById('targetPackSelect');
    select.innerHTML = "";
    const packs = getCustomPacks();
    if (packs.length === 0) {
        select.innerHTML = `<option value="none">Maak eerst een Pack aan!</option>`;
    } else {
        packs.forEach(p => { select.innerHTML += `<option value="${p.id}">${p.name}</option>`; });
    }
    drawEditor();
}

function changeEditorGridSize(size) {
    const s = parseInt(size); editorLevel.width = s; editorLevel.height = s;
    editorLevel.grid = Array(s).fill(null).map(() => Array(s).fill("0"));
    drawEditor();
}

function drawEditor() {
    if (currentScreen !== "editor") return;
    eCtx.clearRect(0, 0, editorCanvas.width, editorCanvas.height);
    const eCellSize = editorCanvas.width / editorLevel.width;

    for (let r = 0; r < editorLevel.height; r++) {
        for (let c = 0; c < editorLevel.width; c++) {
            const cellType = editorLevel.grid[r][c];
            const x = c * eCellSize; const y = r * eCellSize;
            if (cellType === "X") { eCtx.fillStyle = "#222222"; eCtx.fillRect(x, y, eCellSize, eCellSize); }
            else { eCtx.fillStyle = "#3a3a3a"; eCtx.fillRect(x, y, eCellSize, eCellSize); eCtx.strokeStyle = "#555555"; eCtx.strokeRect(x, y, eCellSize, eCellSize); }
            if (cellType !== "0" && cellType !== "X") {
                eCtx.fillStyle = "#0096ff"; const isFormula = cellType.includes('x');
                eCtx.font = `bold ${eCellSize * (isFormula ? 0.25 : 0.4)}px sans-serif`;
                eCtx.textAlign = "center"; eCtx.textBaseline = "middle";
                eCtx.fillText(cellType === "O" ? "•" : cellType, x + eCellSize / 2, y + eCellSize / 2);
            }
        }
    }

    if (editorHoverCell) {
        const x = editorHoverCell.col * eCellSize;
        const y = editorHoverCell.row * eCellSize;
        eCtx.fillStyle = "rgba(0, 150, 255, 0.18)";
        eCtx.fillRect(x, y, eCellSize, eCellSize);
        eCtx.strokeStyle = "#0096ff";
        eCtx.lineWidth = 2;
        eCtx.strokeRect(x + 1, y + 1, eCellSize - 2, eCellSize - 2);
    }
}

function getEditorGridPosition(clientX, clientY) {
    const rect = editorCanvas.getBoundingClientRect();
    const scaleX = editorCanvas.width / rect.width;
    const scaleY = editorCanvas.height / rect.height;
    const eCellWidth = editorCanvas.width / editorLevel.width;
    const eCellHeight = editorCanvas.height / editorLevel.height;
    const col = Math.floor(((clientX - rect.left) * scaleX) / eCellWidth);
    const row = Math.floor(((clientY - rect.top) * scaleY) / eCellHeight);
    if (row >= 0 && row < editorLevel.height && col >= 0 && col < editorLevel.width) return { row, col };
    return null;
}

function handleEditorClick(clientX, clientY) {
    if (currentScreen !== "editor") return;
    const pos = getEditorGridPosition(clientX, clientY);
    if (!pos) return;

    const selectedTool = document.getElementById('toolSelect').value;
    if (selectedTool === "NUMBER") {
        const num = prompt("Voer een getal in:");
        if (num && !isNaN(num)) editorLevel.grid[pos.row][pos.col] = num.trim();
    } else if (selectedTool === "FORMULA") {
        const formula = prompt("Voer de formule in (bijv. 3x2):");
        if (formula && formula.toLowerCase().includes('x')) editorLevel.grid[pos.row][pos.col] = formula.toLowerCase().trim();
    } else {
        editorLevel.grid[pos.row][pos.col] = selectedTool;
    }
    drawEditor();
}

function testCustomLevel() { isTestingCustom = true; const lvl = JSON.parse(JSON.stringify(editorLevel)); lvl.id = "custom_test"; startLevel(lvl); }

function saveCustomLevel() {
    const packId = document.getElementById('targetPackSelect').value;
    if (!packId || packId === "none") { alert("Maak eerst een Level Pack aan in het hoofdmenu!"); return; }
    const packs = getCustomPacks(); const targetPack = packs.find(p => p.id === packId);
    if (targetPack) {
        const newLevel = JSON.parse(JSON.stringify(editorLevel)); newLevel.id = `custom_${Date.now()}`;
        targetPack.levels.push(newLevel); saveCustomPacks(packs); alert(`Level succesvol opgeslagen!`); showMenu();
    }
}

// COÖRDINATEN EN INTERACTIE LOGICA
function getGridPosition(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    // ESSENTIËLE FIX: Bereken exact de positie t.o.v. de werkelijke canvas schaling op de tablet
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const col = Math.floor(((clientX - rect.left) * scaleX) / cellSize);
    const row = Math.floor(((clientY - rect.top) * scaleY) / cellSize);
    if (currentLevel && row >= 0 && row < currentLevel.height && col >= 0 && col < currentLevel.width) return { row, col };
    return null;
}

function touchStartLogic(clientX, clientY) {
    if (currentScreen !== "game") return;
    const pos = getGridPosition(clientX, clientY);
    if (pos && currentLevel.grid[pos.row][pos.col] !== "X") { dragStart = pos; dragEnd = pos; hasDragged = false; drawGame(); }
}

function touchMoveLogic(clientX, clientY) {
    if (!dragStart || currentScreen !== "game") return;
    const pos = getGridPosition(clientX, clientY);
    if (pos) { if (pos.row !== dragStart.row || pos.col !== dragStart.col) hasDragged = true; dragEnd = pos; drawGame(); }
}

function touchEndLogic() {
    if (!dragStart || !dragEnd || currentScreen !== "game") return;
    if (!hasDragged) {
        const isDeleted = tryDeleteShape(dragStart.row, dragStart.col);
        if (!isDeleted) validateAndPlaceShape(dragStart.row, dragStart.row, dragStart.col, dragStart.col);
    } else {
        validateAndPlaceShape(Math.min(dragStart.row, dragEnd.row), Math.max(dragStart.row, dragEnd.row), Math.min(dragStart.col, dragEnd.col), Math.max(dragStart.col, dragEnd.col));
    }
    dragStart = null; dragEnd = null; drawGame();
}

// EVENT LISTENERS GECOORDINEERD KOPPELEN
canvas.addEventListener('touchstart', (e) => { touchStartLogic(e.touches[0].clientX, e.touches[0].clientY); });
canvas.addEventListener('touchmove', (e) => { touchMoveLogic(e.touches[0].clientX, e.touches[0].clientY); });
canvas.addEventListener('touchend', () => { touchEndLogic(); });

canvas.addEventListener('mousedown', (e) => { touchStartLogic(e.clientX, e.clientY); });
window.addEventListener('mousemove', (e) => { touchMoveLogic(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { touchEndLogic(); });

editorCanvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    handleEditorClick(e.clientX, e.clientY);
});
editorCanvas.addEventListener('pointermove', (e) => {
    if (currentScreen !== "editor") return;
    editorHoverCell = getEditorGridPosition(e.clientX, e.clientY);
    drawEditor();
});
editorCanvas.addEventListener('pointerleave', () => {
    editorHoverCell = null;
    drawEditor();
});

packDialog.addEventListener('click', (event) => {
    if (event.target === packDialog) closePackDialog();
});
packNameInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') confirmNewPack();
    if (event.key === 'Escape') closePackDialog();
});

// Start de app direct in het menu
showMenu();
</script>
